version: "3.8"

services:
  startdeck:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        QWEATHER_API_HOST: ${QWEATHER_API_HOST:-}
        QWEATHER_PROJECT_ID: ${QWEATHER_PROJECT_ID:-}
        QWEATHER_CREDENTIAL_ID: ${QWEATHER_CREDENTIAL_ID:-}
        QWEATHER_PRIVATE_KEY_FILE: ${QWEATHER_PRIVATE_KEY_FILE:-}
        TENCENT_MAP_API_HOST: ${TENCENT_MAP_API_HOST:-}
        TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        NPM_CONFIG_DISTURL: ${NPM_CONFIG_DISTURL:-https://npmmirror.com/mirrors/node}
        STARTDECK_CRATES_IO_INDEX: ${STARTDECK_CRATES_IO_INDEX:-sparse+https://mirrors.ustc.edu.cn/crates.io-index/}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://mirrors.ustc.edu.cn/rust-static}
        RUSTUP_UPDATE_ROOT: ${RUSTUP_UPDATE_ROOT:-https://mirrors.ustc.edu.cn/rust-static/rustup}
    image: startdeck:local
    container_name: startdeck
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      - PORT=9001
      - STARTDECK_ADMIN_PASSWORD=violet
      - ICON_SERVICE_PORT=9002
      - ICON_SERVICE_DATA_DIR=/app/Data/icon-service
      - ICON_SERVICE_RESOURCE_DIR=/app/icon-service-defaults/data
      - ICON_SERVER_BASE_URL=http://127.0.0.1:9002
      - ICON_SERVER_TIMEOUT_MS=5000
      - QWEATHER_API_HOST=${QWEATHER_API_HOST:-}
      - QWEATHER_PROJECT_ID=${QWEATHER_PROJECT_ID:-}
      - QWEATHER_CREDENTIAL_ID=${QWEATHER_CREDENTIAL_ID:-}
      - QWEATHER_PRIVATE_KEY_FILE=${QWEATHER_PRIVATE_KEY_FILE:-}
      - TENCENT_MAP_API_HOST=${TENCENT_MAP_API_HOST:-}
      - TENCENT_MAP_KEY=${TENCENT_MAP_KEY:-}
    volumes:
      - ./Data:/app/Data #映射全部运行期数据
      # 如启用 QWeather 备用 IP GeoAPI，请挂载私钥并将 QWEATHER_PRIVATE_KEY_FILE 指向容器内路径。
      # - ./ed25519-private.pem:/run/secrets/qweather-ed25519-private.pem:ro
      - /var/run/docker.sock:/var/run/docker.sock #映射Docker Socket
