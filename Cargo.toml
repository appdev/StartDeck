[workspace]
resolver = "3"
members = [
  "rust/crates/startdeck-core",
  "rust/crates/startdeck-server",
  "rust/crates/startdeck-iconserver",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8.9", features = ["json", "query", "multipart", "ws", "macros"] }
base64 = "0.22"
bcrypt = "0.19.1"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
flate2 = "1.1"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto", "use_pem"] }
mime_guess = "2.0"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "query", "rustls", "gzip", "stream"] }
scraper = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "sqlite-bundled", "chrono", "uuid", "json", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }
walkdir = "2.5"
