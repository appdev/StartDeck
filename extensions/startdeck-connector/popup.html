<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>StartDeck Connector</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        background: #f7f8fb;
        color: #111827;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      p {
        margin: 0;
        color: #4b5563;
      }
      button {
        height: 32px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #111827;
        color: white;
        font: inherit;
        font-weight: 700;
      }
      ul {
        display: grid;
        gap: 6px;
        margin: 0;
        padding: 0;
      }
      li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: white;
        padding: 8px;
      }
      li span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      li button {
        width: 28px;
        height: 28px;
        background: #fee2e2;
        color: #991b1b;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>StartDeck Connector</h1>
      <p>允许列表中的 StartDeck 页面可以通过当前浏览器网络查询 TAPD 和 AI Usage。</p>
      <button id="add-current" type="button">允许当前页面来源</button>
      <ul id="origins"></ul>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
